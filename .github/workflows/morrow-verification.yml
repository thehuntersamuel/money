name: Morrow verification
on:
  pull_request:
  push:
    branches: [main, fix/morrow-reliability]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: morrow_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-not-a-live-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Native PostgreSQL concurrent lifecycle tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: morrow_ci_test
          PGUSER: postgres
          PGPASSWORD: test-only-not-a-live-secret
        run: python3 verification/native_postgres.py
